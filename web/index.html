<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>地震ライブモニター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: fixed 1920x1080 broadcast stage scaled to fit. Status bar on top, map left, facts column right, ticker bottom. */
:root {
  --bg: #060b14;
  --panel: #0c1524;
  --panel-2: #111d31;
  --line: #1d2b44;
  --fg: #eef2f9;
  --dim: #95a3ba;
  --accent: #39c0ff;
  --ok: #2fdc84;
  --warn: #ffb020;
  --alert: #ff2b3a;
  --tsu: #c02bd0;
  --sea: #071322;
  --land: #1b2738;
  --land-line: #3a4c66;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif;
  --font-num: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  /* 気象庁の震度配色 */
  --s10: #f2f2ff; --s20: #00aaff; --s30: #0041ff; --s40: #fae696;
  --s45: #ffe600; --s50: #ff9900; --s55: #ff2800; --s60: #a50021; --s70: #b40068;
  color-scheme: dark;
}
[hidden] { display: none !important; }
/* 言語ごとに本文の書体を切り替える（英語は欧文書体、繁體中文は繁体字書体。日本語の地名は日本語書体で補う） */
html:lang(en) { --font-body: "IBM Plex Sans", "BIZ UDPGothic", "Noto Sans CJK JP", sans-serif; }
html:lang(zh-Hant) { --font-body: "Noto Sans TC", "BIZ UDPGothic", "Noto Sans CJK TC", sans-serif; }
.sub { display: block; font-weight: 400; opacity: .92; }
.sub:empty { display: none; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  margin: 0; overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
body.obs { padding: 0; gap: 0; }
#viewport { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; background: var(--bg); overflow: hidden;
  display: grid; grid-template-rows: 84px 1fr 68px;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
@keyframes blink { 50% { opacity: .35; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,176,32,0); } 50% { box-shadow: 0 0 0 6px rgba(255,176,32,.55); } }

/* ===== 上部バー ===== */
.top { display: grid; grid-template-columns: 520px 1fr auto; align-items: center; gap: 24px; padding: 0 24px; background: linear-gradient(#0d1729, #09111f); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; overflow: hidden; }
.live-tag { font-family: var(--font-num); font-size: 18px; letter-spacing: .12em; padding: 4px 10px; border-radius: 4px; background: var(--alert); color: #fff; flex: none; }
#status { justify-self: center; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 26px; border-radius: 28px; font-size: 26px; font-weight: 700; white-space: nowrap; border: 2px solid; max-width: 860px; overflow: hidden; }
#status i { width: 14px; height: 14px; border-radius: 50%; flex: none; background: currentColor; }
#status[data-s="quiet"] { color: #b9f3d3; border-color: #1f6b47; background: #0a2419; }
#status[data-s="recent"] { color: #ffe1a6; border-color: #b77a10; background: #2a1c03; }
#status[data-s="strong"] { color: #fff; border-color: #ff9900; background: #6b3300; }
#status[data-s="eew"] { color: #fff; border-color: #fff; background: var(--alert); animation: blink 1s infinite; }
#status[data-s="eewf"] { color: #1d1300; border-color: #ffd36b; background: #ffb020; }
#status[data-s="tsu"] { color: #fff; border-color: #ff8bf5; background: #5e0b67; }
#status[data-s="retry"] { color: #ffd88a; border-color: #6a4f14; background: #261c06; }
#status .sc { width: 52px; height: 38px; font-size: 26px; }
.clock { display: flex; align-items: baseline; gap: 14px; padding: 6px 18px; border: 1px solid var(--line); border-radius: 6px; background: #050a12; }
#date { font-size: 22px; color: var(--dim); }
#time { font-size: 46px; font-weight: 600; color: #fff; letter-spacing: .02em; }
#tz { font-size: 18px; color: var(--dim); }

/* ===== メイン ===== */
main { display: grid; grid-template-columns: 1240px 1fr; gap: 16px; padding: 16px; min-height: 0; }
.map-wrap { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
#map { display: block; width: 100%; height: 100%; }
#map .pref { fill: var(--land); stroke: var(--land-line); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .6s; }
#map .pref.eew { fill: #3a0e16; stroke: var(--alert); stroke-width: 3; }
#map .grat { fill: none; stroke: #10233a; stroke-width: 1; vector-effect: non-scaling-stroke; }
.overlay { position: absolute; background: rgba(6,11,20,.86); border: 1px solid var(--line); border-radius: 4px; }
.map-cap { left: 18px; top: 16px; display: flex; gap: 12px; align-items: baseline; font-size: 24px; font-weight: 700; padding: 10px 16px; }
.map-cap small { font-weight: 400; color: var(--dim); font-size: 18px; }
.legend { left: 18px; bottom: 16px; display: flex; gap: 4px; align-items: center; padding: 8px 10px; font-size: 15px; color: var(--dim); }
.legend > span { margin-right: 6px; }
.legend b { width: 36px; height: 26px; font-size: 16px; }
.source { right: 18px; bottom: 16px; padding: 8px 12px; font-size: 15px; color: var(--dim); display: grid; gap: 4px; justify-items: end; }
.source .row { display: flex; align-items: center; gap: 8px; }
.source i { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
.source[data-c="live"] i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.source[data-c="retry"] i { background: var(--warn); }
.source[data-c="demo"] i { background: var(--accent); }
.badge-demo { position: absolute; right: 18px; top: 16px; padding: 8px 14px; border-radius: 4px; background: var(--accent); color: #031522; font-weight: 700; font-size: 18px; letter-spacing: .06em; }

/* 新着の地震情報バナー */
#flash { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 12px 22px; background: #2a1c03; border-bottom: 3px solid var(--warn); }
#flash.strong { background: #5a1405; border-color: #ff6a00; }
#flash .tag { font-size: 22px; font-weight: 700; padding: 6px 12px; border-radius: 4px; background: var(--warn); color: #1d1300; animation: blink 1.2s infinite; }
#flash .txt { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#flashTxt { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; }
#flashSub { font-size: 20px; white-space: nowrap; overflow: hidden; }
#flash .sc { width: 76px; height: 54px; font-size: 38px; border: 2px solid #fff; }

/* 震度チップ */
.sc { display: inline-flex; align-items: baseline; justify-content: center; border-radius: 4px; font-weight: 700; color: #111; line-height: 1; padding-top: .12em; box-sizing: border-box; flex: none; }
.legend b.sc, #status .sc { align-items: center; padding-top: 0; }
.sc-10 { background: var(--s10); } .sc-20 { background: var(--s20); color: #fff; } .sc-30 { background: var(--s30); color: #fff; }
.sc-40 { background: var(--s40); } .sc-45, .sc-46 { background: var(--s45); } .sc-50 { background: var(--s50); }
.sc-55 { background: var(--s55); color: #fff; } .sc-60 { background: var(--s60); color: #fff; } .sc-70 { background: var(--s70); color: #fff; }
.sc-0 { background: #2a364a; color: var(--dim); }
.sc small { font-size: .55em; margin-left: .05em; }

/* ===== 右カラム ===== */
aside { display: grid; grid-template-rows: auto minmax(0, 1fr) 318px; gap: 16px; min-height: 0; min-width: 0; }
aside > section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-height: 0; min-width: 0; }
aside h2 { margin: 0; padding: 12px 18px; font-size: 21px; letter-spacing: .05em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
aside h2 span { font-weight: 400; font-size: 18px; }
.latest { overflow: hidden; }
.latest.fresh { animation: glow 1.4s 6; border-color: var(--warn); }
.latest .eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 21px; font-weight: 700; }
.latest .eyebrow span:last-child { font-weight: 400; color: var(--dim); font-size: 18px; white-space: nowrap; }
.latest-main { display: grid; grid-template-columns: 168px 1fr; gap: 20px; padding: 16px 18px 12px; align-items: center; }
.maxbox { display: grid; gap: 6px; justify-items: center; }
.maxbox .lbl { font-size: 18px; color: var(--dim); letter-spacing: .08em; }
.scale-big { width: 156px; height: 156px; font-size: 100px; border-radius: 10px; flex-direction: column; align-items: center; justify-content: center; padding-top: 0; }
.scale-big small { font-size: .48em; margin: 2px 0 0; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: baseline; min-width: 0; }
.facts dt { font-size: 18px; color: var(--dim); white-space: nowrap; }
.facts dd { margin: 0; font-size: 26px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.facts dd.epi { font-size: 36px; line-height: 1.15; }
.facts dd .num { font-size: 28px; }
.elapsed { margin: 0 18px 12px; font-size: 20px; color: var(--dim); }
.elapsed b { color: var(--fg); font-family: var(--font-num); font-size: 24px; }
.tsunami { margin: 0 18px 16px; padding: 12px 16px; border-radius: 5px; font-size: 22px; font-weight: 700; border: 1px solid; }
.tsunami.ok { color: #a7ecc8; border-color: #1f5a3f; background: #0b2219; }
.tsunami.chk { color: #ffd88a; border-color: #6a4f14; background: #261c06; }
.tsunami.bad { color: #fff; border-color: #ff8bf5; background: #5e0b67; animation: blink 1.2s infinite; }

.points { display: grid; grid-template-rows: auto minmax(0,1fr); }
#pointsBox { overflow: hidden; padding: 4px 18px 10px; }
.prow { display: grid; grid-template-columns: 70px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid #16233a; align-items: start; }
.prow .sc { width: 70px; height: 44px; font-size: 28px; }
.prow .places { font-size: 22px; line-height: 1.55; min-width: 0; }
.prow .places b { color: var(--dim); font-weight: 400; margin-right: 8px; }
.empty { color: var(--dim); font-size: 20px; padding: 16px 0; }

.history { overflow: hidden; }
.history ol { list-style: none; margin: 0; padding: 2px 0; }
.history li { display: grid; grid-template-columns: 52px 130px 1fr 80px; gap: 12px; align-items: center; height: 52px; padding: 0 18px; font-size: 21px; border-bottom: 1px solid #16233a; }
.history li .sc { width: 52px; height: 38px; font-size: 24px; }
.history li .t { color: var(--dim); font-size: 18px; }
.history li .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.history li .m { text-align: right; font-size: 19px; }
.history li.cur { background: #13213a; }

/* ===== テロップ ===== */
.ticker { display: grid; grid-template-columns: auto 1fr; align-items: center; background: #0a1322; border-top: 1px solid var(--line); overflow: hidden; }
.tk-label { height: 100%; display: grid; place-items: center; padding: 0 24px; background: var(--accent); color: #031522; font-weight: 700; font-size: 24px; letter-spacing: .08em; white-space: nowrap; }
.tk-track { overflow: hidden; white-space: nowrap; position: relative; height: 100%; }
#tkText { position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; white-space: nowrap; will-change: transform; }
#tkText span { margin-right: 140px; }
.ticker.alert .tk-label { background: var(--tsu); color: #fff; }

/* ===== 緊急地震速報 ===== */
#eew { position: absolute; left: 16px; top: 100px; width: 1240px; z-index: 5; background: var(--alert); color: #fff; border-radius: 6px 6px 0 0; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#eew .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px; background: #c4001b; border-radius: 6px 6px 0 0; }
#eew .head .ttl { min-width: 0; flex: 1 1 auto; overflow: hidden; }
#eew .head strong { display: block; font-size: 44px; letter-spacing: .04em; animation: blink 1s infinite; white-space: nowrap; overflow: hidden; }
#eew .head .ttl .sub { font-size: 20px; white-space: nowrap; overflow: hidden; }
#eew .head span { font-size: 22px; }
#eew .body { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 14px 22px 16px; align-items: center; }
#eew .body > div:first-child { min-width: 0; overflow: hidden; }
#eew .msg { font-size: 30px; font-weight: 700; line-height: 1.35; white-space: nowrap; overflow: hidden; }
#eew .submsg { font-size: 22px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; }
#eew .submsg:empty { display: none; }
#eew .areas { font-size: 22px; margin-top: 6px; white-space: nowrap; overflow: hidden; }
#eew .pred { display: grid; justify-items: center; gap: 4px; font-size: 18px; }
#eew .pred .sc { width: 120px; height: 92px; font-size: 62px; border: 3px solid #fff; }
#eew.fc { background: #ffb020; color: #1d1300; }
#eew.fc .head { background: #e09600; }
#eew.fc .head strong { animation: none; }
#eew.fc .pred .sc { border-color: #1d1300; }
#eew .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 22px; white-space: nowrap; flex: none; }
#eew .head { gap: 24px; }
#eew .meta b { font-family: var(--font-num); font-size: 26px; }
#eew.cancel { background: #3a4458; }
#eew.cancel .head { background: #2a3244; }
#eew.cancel .head strong { animation: none; }

#tsuBar { position: absolute; left: 16px; bottom: 84px; width: 1240px; z-index: 4; padding: 14px 22px; border-radius: 6px; font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; color: #fff; background: #5e0b67; border: 2px solid #ff8bf5; box-sizing: border-box; }
#tsuBar.watch { background: #5e4f00; border-color: var(--s45); }

/* P波・S波 */
#map .wave-p { fill: none; stroke: #4fd2ff; stroke-width: 3; vector-effect: non-scaling-stroke; }
#map .wave-s { fill: rgba(255,43,58,.16); stroke: #ff3b4a; stroke-width: 4; vector-effect: non-scaling-stroke; }
.wave-legend { left: 18px; bottom: 16px; display: flex; gap: 22px; align-items: center; padding: 8px 16px; font-size: 18px; white-space: nowrap; }
.wave-legend i { display: inline-block; width: 26px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 8px; }
.wave-legend .p i { border-color: #4fd2ff; } .wave-legend .s i { border-color: #ff3b4a; }
.wave-legend small { color: var(--dim); font-size: 15px; }
.wave-legend b { font-family: var(--font-num); }

/* ===== プレビュー操作（配信モードでは非表示） ===== */
#demoPanel { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
#demoPanel p { margin: 0 6px 0 0; color: var(--dim); font-size: 13px; }
#demoPanel .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
#demoPanel button { font: 700 14px var(--font-body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--land-line); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
#demoPanel button:hover { border-color: var(--accent); }
#demoPanel button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#demoPanel button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#demoPanel button.red { border-color: var(--alert); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="viewport">
  <div id="stage">
    <header class="top">
      <div class="brand"><span class="live-tag">LIVE</span><span id="chName"></span></div>
      <div id="status" data-s="quiet"><i></i><span id="statusText"></span></div>
      <div class="clock"><span id="date" class="num"></span><span id="time" class="num">--:--:--</span><span id="tz" class="num"></span></div>
    </header>
    <main>
      <section class="map-wrap">
        <svg id="map" viewBox="0 0 1240 900" aria-label="map"></svg>
        <div id="flash" hidden><span class="tag" id="flashTag"></span><span class="txt"><span id="flashTxt"></span><small id="flashSub" class="sub"></small></span><span class="sc sc-0" id="flashSc">-</span></div>
        <div class="overlay map-cap" id="mapCap"><span id="mapTitle"></span><small id="mapSub"></small></div>
        <div class="overlay legend" id="legend"></div>
        <div class="overlay source" id="source" data-c="retry"><div class="row"><i></i><span id="connText"></span></div><div id="srcText"></div></div>
        <div class="badge-demo" id="demoBadge" hidden></div>
        <div class="overlay wave-legend" id="waveLegend" hidden><span class="p"><i></i><span id="wlP"></span></span><span class="s"><i></i><span id="wlS"></span></span><small id="wlNote"></small></div>
      </section>
      <aside>
        <section class="latest" id="latestBox">
          <div class="eyebrow"><span id="lType"></span><span id="lIssued"></span></div>
          <div class="latest-main">
            <div class="maxbox"><span class="lbl" id="tMax"></span><div id="lScale" class="sc sc-0 scale-big">-</div></div>
            <dl class="facts">
              <dt id="tEpi"></dt><dd class="epi" id="lEpi">―</dd>
              <dt id="tTime"></dt><dd id="lTime">―</dd>
              <dt id="tMag"></dt><dd id="lMag">―</dd>
              <dt id="tDepth"></dt><dd id="lDepth">―</dd>
            </dl>
          </div>
          <div class="elapsed" id="lElapsed"></div>
          <div class="tsunami ok" id="lTsunami">―</div>
        </section>
        <section class="points">
          <h2><span id="tPoints" style="font-size:inherit;font-weight:inherit"></span><span id="ptCount"></span></h2>
          <div id="pointsBox"><div id="pointsList"></div></div>
        </section>
        <section class="history">
          <h2><span id="tHist" style="font-size:inherit;font-weight:inherit"></span><span id="histCount"></span></h2>
          <ol id="hist"></ol>
        </section>
      </aside>
    </main>
    <footer class="ticker" id="ticker"><div class="tk-label" id="tkLabel"></div><div class="tk-track"><div id="tkText"></div></div></footer>

    <div id="eew" hidden>
      <div class="head"><div class="ttl"><strong id="eewTitle"></strong><small id="eewSubTitle" class="sub"></small></div><span class="meta"><span id="eewMeta"></span><span id="eewElapsed"></span></span></div>
      <div class="body">
        <div><div class="msg" id="eewMsg"></div><div class="submsg" id="eewSubMsg"></div><div class="areas" id="eewAreas"></div></div>
        <div class="pred"><span id="eewPredLbl"></span><div class="sc sc-0" id="eewScale">-</div></div>
      </div>
    </div>
    <div id="tsuBar" hidden></div>
  </div>
</div>

<div id="demoPanel" hidden aria-label="preview controls">
  <p>プレビュー操作</p>
  <button id="btnQuake" type="button">地震情報を再生</button>
  <button id="btnEEW" type="button" class="red">緊急地震速報（警報）テスト</button>
  <button id="btnEEWfc" type="button">緊急地震速報（予報）テスト</button>
  <button id="btnTsu" type="button">津波注意報テスト</button>
  <button id="btnQuiet" type="button">平常時の表示</button>
  <button id="btnClear" type="button">リセット</button>
  <span class="sep"></span>
  <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
  <button type="button" data-lang="en" aria-pressed="false">English</button>
  <button type="button" data-lang="zh" aria-pressed="false">繁體中文</button>
  <span class="sep"></span>
  <button type="button" id="btnSub" aria-pressed="false">英語字幕 ON/OFF</button>
</div>

  const newest = sortedEvents()[0];
  if (newest && (!before || newest._t > before._t)) { current = newest; if (before && Date.now() - newest._t < 10 * 60e3) showFlash(newest); if (!eewActive()) render(true); }
  else if (added && !eewActive()) render(false);
  markRx();
}
let ws = null, backoff = 1000;
function connectWS() {
  if (demoMode) return;
  try { ws = new WebSocket(CONFIG.wsUrl); } catch (e) { scheduleWS(); return; }
  ws.onopen = () => { backoff = 1000; setConn('live'); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } markRx(); ingest(m, true); };
  ws.onclose = () => { if (demoMode) return; setConn('retry'); scheduleWS(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function scheduleWS() { setTimeout(connectWS, backoff); backoff = Math.min(30000, backoff * 2); }
// 緊急地震速報（予報・警報）を Wolfx から受信
let ews = null, eBackoff = 1000, eLast = 0;
function connectEEW() {
  if (demoMode || !USE_WOLFX) return;
  try { ews = new WebSocket(CONFIG.eewWsUrl); } catch (e) { setTimeout(connectEEW, eBackoff); eBackoff = Math.min(30000, eBackoff * 2); return; }
  ews.onopen = () => { eBackoff = 1000; eLast = Date.now(); };
  ews.onmessage = ev => { eLast = Date.now(); let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m && m.type === 'jma_eew') handleEEW(fromWolfx(m)); };
  ews.onclose = () => { if (demoMode) return; setTimeout(connectEEW, eBackoff); eBackoff = Math.min(30000, eBackoff * 2); };
  ews.onerror = () => { try { ews.close(); } catch (e) {} };
}
// 3分間なにも届かなければ（ハートビートも含む）つなぎ直す
setInterval(() => { if (ews && ews.readyState === 1 && Date.now() - eLast > 180e3) { try { ews.close(); } catch (e) {} } }, 30e3);
// 万一ページが固まった場合に備え、6時間ごとに再読み込み（緊急地震速報の表示中は除く）
setInterval(() => { if (OBS && !eewActive() && !tsunami) location.reload(); }, 6 * 3600e3);

// ===================== 言語の切り替え =====================

  if (eewActive()) { if (!$('eew').classList.contains('cancel')) paintEEW(); renderLatest(current); renderPoints(current); renderHistory(sortedEvents()); renderTicker(); renderStatus(); }
  else render(false);
  renderTsuBar();
  if (!$('flash').hidden && current) showFlash(current);
}

      P('群馬県', '前橋市', 10), P('福島県', 'いわき市', 20), P('静岡県', '熱海市', 10), P('山梨県', '甲府市', 10)])

let demoSeq = 0;
function startDemo() {
  demoMode = true; setConn('demo'); $('demoBadge').hidden = false;
  if (!OBS) { $('demoPanel').hidden = false; fit(); }
  demoData().forEach(m => ingest(m, false));
  current = sortedEvents()[0]; render(true);
}
function replayQuake() {
  const base = demoData()[8]; const n = ++demoSeq;
  events.delete(base.earthquake.time); if (current && current.earthquake.time === base.earthquake.time) current = null;
  const steps = [
    { ...base, id: 'r' + n + 'a', issue: { ...base.issue, type: 'ScalePrompt' }, earthquake: { ...base.earthquake, hypocenter: { name: '', latitude: -200, longitude: -200, depth: -1, magnitude: -1 }, domesticTsunami: 'Checking' }, points: base.points.filter(p => p.scale >= 30) },
    { ...base, id: 'r' + n + 'b', issue: { ...base.issue, type: 'ScaleAndDestination' }, points: base.points.filter(p => p.scale >= 30) },
    { ...base, id: 'r' + n + 'c' }
  ];
  const j = jst(new Date()); const now = `${j.y}/${pad(j.mo)}/${pad(j.d)} ${pad(j.h)}:${pad(j.mi)}:00`;
  steps.forEach(s => { s.earthquake = { ...s.earthquake, time: now }; s.issue = { ...s.issue, time: now }; });
  steps.forEach((s, i) => setTimeout(() => ingest(s, true), i * 4000));
}
function demoTS(d) { const j = jst(d); return `${j.y}/${pad(j.mo)}/${pad(j.d)} ${pad(j.h)}:${pad(j.mi)}:${pad(j.s)}`; }
